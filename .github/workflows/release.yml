name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch test fixtures
        run: |
          git clone --depth 1 https://github.com/boligolov/excsv.git /tmp/excsv-spec
          mkdir -p test/fixtures
          cp /tmp/excsv-spec/fixtures/fixtures.yaml test/fixtures/
          cp -r /tmp/excsv-spec/fixtures/plain test/fixtures/
          python3 /tmp/excsv-spec/fixtures/generate/make_zip_fixtures.py
          python3 /tmp/excsv-spec/fixtures/generate/make_pack_fixtures.py
          if [ -d /tmp/excsv-spec/fixtures/zip ]; then
            cp -r /tmp/excsv-spec/fixtures/zip test/fixtures/
          fi
          if [ -d /tmp/excsv-spec/fixtures/pack ]; then
            cp -r /tmp/excsv-spec/fixtures/pack test/fixtures/
          fi

      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="$(bash scripts/version.sh)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CLI_PKG="$(go list -f '{{.ImportPath}}' ./internal/cli)"
          OUT="excsv-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X ${CLI_PKG}.Version=${VERSION} -X ${CLI_PKG}.BuildTime=${BUILD_TIME}" \
            -o "$OUT" \
            ./cmd/excsv

      - uses: actions/upload-artifact@v4
        with:
          name: excsv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: excsv-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum excsv-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/excsv-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
